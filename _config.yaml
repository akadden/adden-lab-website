# site properties and page defaults
title: Adden Lab
subtitle: Tsetse sensory ecology and neuroethology of viviparity
description: The Adden lab is interested in the evolution and neural basis of behaviour, particularly maternal care behaviours. We study tsetse flies to understand how sensory and neural systems change to support changing behavioural demands in both mothers and offspring.
header: images/background.jpg
footer: images/background.jpg
proofer: false

# site social media and other links
links:
  email: andrea.adden@bristol.ac.uk
  orcid: 0000-0001-6455-6313
  google-scholar: D9DJI28AAAAJ
  #linkedin: andrea-adden-39513799
  #github: akadden
